<header class="header">
  <div class="container header__inner">
    <a class="brand" routerLink="/" (click)="closeMenu()">
      <span class="brand__mark"><app-icon name="droplet" [size]="22" /></span>
      <span class="brand__text">
        <strong>BADASS</strong>
        <small>POOL CLEAN</small>
      </span>
    </a>

    <nav class="nav" [class.nav--open]="menuOpen()">
      @for (link of links; track link.path) {
        <a
          class="nav__link"
          [routerLink]="link.path"
          routerLinkActive="nav__link--active"
          (click)="closeMenu()"
        >{{ link.label }}</a>
      }
      <a class="btn btn--primary nav__cta" routerLink="/estimate" (click)="closeMenu()">Get Estimate</a>
    </nav>

    <button class="header__toggle" type="button" (click)="toggleMenu()" aria-label="Toggle navigation">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>
